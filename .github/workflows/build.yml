name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - run: dotnet restore Zapret2Ultra.csproj
      - run: dotnet build Zapret2Ultra.csproj -c Release --no-restore
      - run: dotnet publish Zapret2Ultra.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Zapret2Ultra-win-x64
          path: publish/Zapret2Ultra.exe
